<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>記事一覧｜楽天モバイル社員の紹介ページ</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="site-logo">📱 楽天モバイル紹介ページ</a>

        <a href="/#apply">申し込む</a>

  <section class="section">
    <div class="container">
      <h1 class="section-title">記事一覧</h1>

      <div class="article-list">
        <!-- 記事が増えたらここに追加

        -->

          <p>記事を準備中です。もうしばらくお待ちください。</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">

      <p>このページは楽天モバイル社員による紹介ページです。</p>
      <p>掲載の料金・特典は変更になる場合があります。最新情報は<a href="https://network.mobile.rakuten.co.jp/" target="_blank" rel="noopener noreferrer">楽天モバイル公式サイト</a>をご確認ください。</p>
    </div>
