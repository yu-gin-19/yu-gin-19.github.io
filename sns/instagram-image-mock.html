<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>楽天モバイル Instagram画像モックアップ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      padding: 40px 20px;
      gap: 32px;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: -20px;
      font-weight: 500;
    }

    /* ============================
       Instagram投稿正方形 600×600
    ============================ */
    .card {
      width: 600px;
      height: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    /* ---------- 背景グラデーション ---------- */
    .card__bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #ff008c 0%, #c9006b 55%, #8c0049 100%);
    }

    /* 装飾：右上の大きな円 */
    .card__circle-1 {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    /* 装飾：左下の小さな円 */
    .card__circle-2 {
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    /* ---------- コンテンツ本体 ---------- */
    .card__body {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 44px 48px 36px;
    }

    /* ブランドバッジ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 20px;
      width: fit-content;
      margin-bottom: 24px;
    }

    .badge__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* メインコピー */
    .main-copy {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    /* 料金ヒーロー */
    .price-hero {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 32px;
    }

    .price-hero__amount {
      color: #fff;
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .price-hero__unit {
      color: rgba(255,255,255,0.85);
      font-size: 28px;
      font-weight: 700;
    }

    .price-hero__plan {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      font-weight: 600;
      margin-left: 4px;
    }

    /* 区切り線 */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.25);
      margin-bottom: 24px;
    }

    /* 比較テーブル */
    .compare {
      width: 100%;
      margin-bottom: 28px;
    }

    .compare__title {
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .compare__rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .compare__row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .compare__label {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      font-weight: 500;
      width: 110px;
      flex-shrink: 0;
    }

    /* 楽天モバイル側の価格バー */
    .compare__bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .compare__bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compare__bar-name {
      color: rgba(255,255,255,0.65);
      font-size: 10px;
      font-weight: 500;
      width: 60px;
      flex-shrink: 0;
      text-align: right;
    }

    .compare__bar {
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      position: relative;
    }

    .compare__bar--rakuten {
      background: rgba(255,255,255,0.28);
      border: 1.5px solid rgba(255,255,255,0.6);
    }

    .compare__bar--other {
      background: rgba(0,0,0,0.22);
    }

    /* セービングバッジ */
    .saving-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 20px;
    }

    .saving-badge__icon {
      font-size: 22px;
    }

    .saving-badge__text {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .saving-badge__text span {
      font-size: 20px;
      font-weight: 900;
    }

    /* フッター：CTA */
    .cta {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cta__point {
      background: #fff;
      color: #ff008c;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.3;
      text-align: center;
    }

    .cta__point span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-bottom: 2px;
    }

    .cta__arrow {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      font-weight: 600;
    }

    .cta__url {
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-weight: 500;
      text-align: right;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <p class="label">Instagram投稿画像モックアップ（600×600px）</p>

  <!-- ============================
       投稿画像本体 600×600
  ============================ -->
  <div class="card">

    <!-- 背景 -->
    <div class="card__bg"></div>
    <div class="card__circle-1"></div>
    <div class="card__circle-2"></div>

    <!-- コンテンツ -->
    <div class="card__body">

      <!-- バッジ -->
      <div class="badge">
        <div class="badge__dot"></div>
        楽天モバイル社員による紹介
      </div>

      <!-- メインコピー + 料金 -->
      <div class="main-copy">データ無制限がこの料金</div>
      <div class="price-hero">
        <div class="price-hero__amount">3,278</div>
        <div class="price-hero__unit">円</div>
        <div class="price-hero__plan">/ 月（税込）</div>
      </div>

      <div class="divider"></div>

      <!-- 比較 -->
      <div class="compare">
        <div class="compare__title">大手3社との料金比較（無制限プラン）</div>
        <div class="compare__rows">

          <div class="compare__row">
            <div class="compare__label">楽天モバイル</div>
            <div class="compare__bar-wrap">
              <div class="compare__bar-row">
                <div class="compare__bar compare__bar--rakuten" style="width: 180px;">
                  月3,278円
                </div>
              </div>
            </div>
          </div>

          <div class="compare__row">
            <div class="compare__label">大手3社（目安）</div>
            <div class="compare__bar-wrap">
              <div class="compare__bar-row">
                <div class="compare__bar compare__bar--other" style="width: 380px;">
                  月7,000円台〜
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- 節約額バッジ -->
      <div class="saving-badge">
        <div class="saving-badge__icon">💰</div>
        <div class="saving-badge__text">
          年間で<span>約4万円以上</span>節約できる可能性
        </div>
      </div>

      <!-- CTA フッター -->
      <div class="cta">
        <div class="cta__point">
          <span>社員紹介リンクで</span>
          乗り換え14,000P
        </div>
        <div class="cta__arrow">
          プロフィールのリンクから申し込む
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    </div><!-- /.card__body -->
  </div><!-- /.card -->

</body>
</html>
